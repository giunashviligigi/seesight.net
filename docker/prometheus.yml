# Scrapes the OTel Collector's Prometheus exporter (metrics from every SeeSight
# service, once they exist and are wired via SeeSight.Shared.Observability) and
# Prometheus's own self-metrics. Per Observability.md §2.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
