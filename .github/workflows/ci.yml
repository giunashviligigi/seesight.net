# CI for the SeeSight.net solution. Path-filtered per Deployment.md §5 so a
# docs-only change doesn't trigger a full build/test cycle. As of M1 (Gateway +
# Identity Service) everything still runs as one job — splitting into
# per-service jobs is deferred until there are enough services for the
# isolation to actually save CI time (Deployment.md §5's stated goal), not
# introduced speculatively for two services.
#
# Branch strategy (see CodingStandards.md): `main` = approved milestones only,
# `development` = active work. CI runs on pushes and PRs to both.
#
# Integration tests use Testcontainers (a real, ephemeral Postgres per test
# run) — this works out of the box on GitHub's ubuntu-latest runners, which
# have Docker preinstalled.

name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'SeeSight.sln'
              - '.config/dotnet-tools.json'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Restore
        run: dotnet restore SeeSight.sln

      - name: Build
        run: dotnet build SeeSight.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test SeeSight.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./TestResults
        continue-on-error: false

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: warn

      - name: Format check
        run: dotnet format SeeSight.sln --verify-no-changes --verbosity minimal
